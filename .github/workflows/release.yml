name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - name: Check release tag
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv run just package-check
      - run: uv publish
